services:
  # 1. Backend Web Service (Node.js API)
  - type: web
    name: luxlunch-server
    runtime: node
    plan: free
    rootDir: .wasp/out/server
    buildCommand: npm install && npx prisma generate --schema='../db/schema.prisma'
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WASP_WEB_CLIENT_URL
        sync: false

  # 2. Frontend Static Site (React Vite SPA)
  - type: web
    name: luxlunch-client
    runtime: static
    rootDir: .
    buildCommand: npm install && npx vite build
    staticPublishPath: dist
    envVars:
      - key: REACT_APP_API_URL
        sync: false
